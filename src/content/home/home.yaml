coreStatement: "We develop machine-learning methods to understand biology and improve medicine."
supporting: >-
  Our research spans foundational machine learning and real-world biomedical AI,
  across clinical, imaging, cellular, molecular and other forms of data.

ctaPrimary:   { label: "Explore our research", href: "/research" }
ctaSecondary: { label: "Meet the lab",         href: "/people" }

researchIntro: >-
  AIMS develops machine-learning methodology and applies it across medicine and the
  life sciences. We are interested in learning systems that generalise across settings,
  adapt to new data, and work effectively with human experts — especially where data are
  scarce and uncertainty matters. We think in terms of methods and domains rather than
  individual projects, and most of our work sits at the intersection of several.

selectedWorkIntro: >-
  A few pieces of work that show the range of what we do — from foundational methods
  to clinical AI and cellular biology.

readingIntro: "Every week we read and discuss a paper or two we think is worth understanding."

cultureIntro: >-
  AIMS is a shared research environment spanning machine learning, medicine and the
  life sciences — several groups, one reading group, and a lot of cross-disciplinary work.

joinIntro: "Interested in working with us?"
