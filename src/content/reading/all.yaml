  - title: "Carré du champ FLOW MATCHING: BETTER QUALITYGENERALISATION TRADEOFF IN GENERATIVE MODELS"
    authors: "Presented by Felipe Colombelli"
    venue: "ICLR"
    year: 2026
    url: "https://openreview.net/forum?id=psmrKQ5lJe"
    why: "The authors proposed a regularization method for Flow Matching to fight memorization explicitly in the training objective. Their method uses a local anisotropic gaussian instead of a global isotropic one. The idea is to put uncertainty mass only in the directions that follow the local curvature of the data geometry, under the manifold hypothesis. They bring some evidence supporting that their method improves FM's quality-generalisation tradeoff."
