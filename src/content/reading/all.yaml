    authors: "Presented by Robert Welch"
    venue: "arXiv"
    year: 2026
    url: "https://arxiv.org/abs/2610.14136"
    why: "They mainly improve unconditional (also conditional but with less improvement) generation for diffusion models by adding a second corrector network. During inference, the corrector network takes a denoised image at time-step t, and pushes it towards the clean image. It's not exactly clear why this works so well, but they argue this helps push the denoised images closer to the training distribution of noised images, helping with the denoising process."
