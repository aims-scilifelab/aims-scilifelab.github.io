# =========================================================================
# IN THE PRESS  —  curated media coverage.
#
# Two things live here:
#   • featuredOutlets — the short list of outlet names shown in the small
#     "Featured in" strip on the home page. Keep it to the most recognizable.
#   • items — the full list shown on /press, newest first.
#
# CURATION RULE: add an item only when an AiMS person is named/interviewed,
# OR is an author of the research being reported (note them in `people`).
# Avoid listing many reprints of the same release — pick the best one or two.
#
#   date:     YYYY-MM-DD (publication date)
#   outlet:   publication / broadcaster
#   headline: the article title
#   url:      link to the original coverage
#   topic:    research theme (groups related items on the page)
#   people:   AiMS people connected to the story
#   lang:     EN, SV, …
# =========================================================================

